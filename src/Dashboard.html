<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadence Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --page: #f3f5f9; --surface: #ffffff; --surface-2: #f8f9fb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --line: #e4e6eb; --grid: #e1e0d9; --axis: #c3c2b7; --brand: #0d366b; --brand-2: #184f95;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --ref: #b9c3d3;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
    --good-bg: #e7f6e7; --warning-bg: #fff4d9; --serious-bg: #fdebe3; --critical-bg: #fbe5e5;
    --good-ink: #006300; --warning-ink: #7a5200; --serious-ink: #9a3d17; --critical-ink: #a32626;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 16px rgba(16, 24, 40, .06);
    --ring: rgba(11, 11, 11, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222221; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --line: #2c2c2a; --grid: #2c2c2a; --axis: #383835; --brand: #9ec5f4; --brand-2: #6da7ec;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --ref: #4a5466;
      --good-bg: #13301a; --warning-bg: #3a2f10; --serious-bg: #3a2216; --critical-bg: #3b1a1a;
      --good-ink: #5fd35f; --warning-ink: #fab219; --serious-ink: #f2a17f; --critical-ink: #f08a8a;
      --shadow: 0 0 #0000; --ring: rgba(255, 255, 255, .10);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222221; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --line: #2c2c2a; --grid: #2c2c2a; --axis: #383835; --brand: #9ec5f4; --brand-2: #6da7ec;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --ref: #4a5466;
    --good-bg: #13301a; --warning-bg: #3a2f10; --serious-bg: #3a2216; --critical-bg: #3b1a1a;
    --good-ink: #5fd35f; --warning-ink: #fab219; --serious-ink: #f2a17f; --critical-ink: #f08a8a;
    --shadow: 0 0 #0000; --ring: rgba(255, 255, 255, .10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--ink);
    font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 18px 20px 28px; }
  header.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  .logo { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #0d366b, #2a78d6);
    display: grid; place-items: center; box-shadow: var(--shadow); flex: none; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--ink-2); font-size: 12.5px; }
  .spacer { flex: 1; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; background: var(--surface); box-shadow: inset 0 0 0 1px var(--ring); color: var(--ink-2); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  button { font: inherit; font-weight: 600; font-size: 13px; border: 0; border-radius: 10px; padding: 8px 14px; cursor: pointer;
    background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--ring); }
  button.primary { background: #0d366b; color: #fff; box-shadow: none; }
  button:disabled { opacity: .55; cursor: progress; }
  button:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }

  .tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
  .tile { background: var(--surface); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow), inset 0 0 0 1px var(--ring); }
  .tile .lab { font-size: 12px; color: var(--ink-2); font-weight: 600; }
  .tile .val { font-size: 28px; font-weight: 800; letter-spacing: -.02em; margin: 2px 0 0; }
  .tile .val small { font-size: 15px; font-weight: 600; color: var(--ink-2); }
  .tile .note { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .tile.alert { box-shadow: var(--shadow), inset 0 0 0 1.5px var(--critical); }

  .card { overflow-wrap: anywhere; background: var(--surface); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow), inset 0 0 0 1px var(--ring); min-width: 0; }
  .card h2 { font-size: 14.5px; margin: 0; letter-spacing: -.005em; }
  .card .hint { font-size: 12px; color: var(--muted); margin: 2px 0 10px; }
  .row { display: grid; gap: 14px; margin-bottom: 14px; }
  .r-2 { grid-template-columns: 5fr 7fr; }
  .r-3 { grid-template-columns: 1fr 1fr 1fr; }
  .r-2b { grid-template-columns: 7fr 5fr; }
  .r-eq { grid-template-columns: 1fr 1fr; }

  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .pill.good { background: var(--good-bg); color: var(--good-ink); }
  .pill.warning { background: var(--warning-bg); color: var(--warning-ink); }
  .pill.serious { background: var(--serious-bg); color: var(--serious-ink); }
  .pill.critical { background: var(--critical-bg); color: var(--critical-ink); }
  .pill svg { width: 12px; height: 12px; }

  /* La ligne */
  .flow { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 22px; position: relative; margin-top: 6px; }
  .st { position: relative; background: var(--surface-2); border-radius: 14px; padding: 12px; box-shadow: inset 0 0 0 1px var(--ring); }
  .st.critical { background: var(--critical-bg); box-shadow: inset 0 0 0 1.5px var(--critical); }
  .st.serious { box-shadow: inset 0 0 0 1.5px var(--serious); }
  .st:not(:last-child)::after { content: ""; position: absolute; right: -17px; top: 50%; width: 12px; height: 12px;
    border-top: 2px solid var(--axis); border-right: 2px solid var(--axis); transform: translateY(-50%) rotate(45deg); }
  .st .code { font-weight: 800; font-size: 13px; color: var(--brand); }
  .st .name { font-size: 12px; color: var(--ink-2); min-height: 34px; line-height: 1.35; margin: 2px 0 8px; }
  .lots { display: flex; gap: 4px; flex-wrap: wrap; min-height: 18px; margin-bottom: 8px; }
  .lot { width: 16px; height: 16px; border-radius: 5px; }
  .lot.run { background: var(--s1); }
  .lot.wait { background: transparent; box-shadow: inset 0 0 0 2px var(--s2); }
  .st .meta { font-size: 11.5px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 6px; }
  .bar { height: 6px; border-radius: 4px; background: var(--grid); margin: 6px 0 2px; position: relative; overflow: hidden; }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--s1); }
  .bar > b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .5; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }

  /* Brief */
  .brief p { margin: 0 0 7px; font-size: 13.5px; }
  .brief .src { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0 12px; }
  .brief .check { font-size: 12px; color: var(--muted); margin-top: 10px; }

  /* Récurrences */
  .rec { display: grid; gap: 10px; }
  .rec .it { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; padding: 12px; border-radius: 12px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--ring); }
  .rec .big { font-size: 22px; font-weight: 800; line-height: 1; min-width: 44px; text-align: center; }
  .rec .big small { display: block; font-size: 10.5px; font-weight: 600; color: var(--muted); margin-top: 3px; }
  .rec .t { font-weight: 700; font-size: 13.5px; }
  .rec .d { font-size: 12.5px; color: var(--ink-2); }
  .rec .act { font-size: 12.5px; margin-top: 4px; }

  .tbl { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 7px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }
  details { margin-top: 8px; font-size: 12px; color: var(--ink-2); }
  details summary { cursor: pointer; color: var(--muted); }

  svg text { font-family: inherit; }
  .chart { width: 100%; height: auto; display: block; overflow: visible; }
  .tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 10px;
    font-size: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18), inset 0 0 0 1px var(--ring); opacity: 0; transition: opacity .08s; max-width: 260px; }
  .tip b { display: block; margin-bottom: 2px; }
  .metro-head { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .stat { flex: 1; min-width: 92px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; box-shadow: inset 0 0 0 1px var(--ring); }
  .stat .v { font-size: 22px; font-weight: 800; }
  .stat .l { font-size: 11.5px; color: var(--ink-2); }
  .five { display: grid; gap: 9px; }
  .five .r { display: grid; grid-template-columns: 38px 1fr 64px 46px; gap: 10px; align-items: center; font-size: 12.5px; }
  .five .code { font-weight: 700; color: var(--brand); }
  .five .track { height: 10px; background: var(--grid); border-radius: 6px; position: relative; }
  .five .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--s3); }
  .five .track i.low { background: var(--critical); }
  .five .num { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .delta { font-size: 11.5px; font-weight: 700; }
  .delta.up { color: var(--good-ink); } .delta.down { color: var(--critical-ink); }
  .foot { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 8px; }
  .loading { display: grid; place-items: center; height: 60vh; color: var(--ink-2); }
  .err { background: var(--critical-bg); color: var(--critical-ink); padding: 14px; border-radius: 12px; }
  @media (max-width: 1100px) { .tiles { grid-template-columns: repeat(3, 1fr); } .flow { grid-template-columns: repeat(3, 1fr); }
    .st:nth-child(3)::after { display: none; } .r-2, .r-3, .r-2b, .r-eq { grid-template-columns: 1fr; } }
  @media (max-width: 620px) { .wrap { padding: 12px 16px; } td, th { white-space: nowrap; } .tiles { grid-template-columns: repeat(2, 1fr); } .flow { grid-template-columns: repeat(2, 1fr); }
    .st::after { display: none; } }
  @media print { .actions { display: none; } body { background: #fff; } }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Chargement du cockpit...</div></div>
<div class="tip" id="tip" role="tooltip"></div>

<script>
(function () {
  'use strict';
  var ICON = {
    good: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2l2.2 2.2 4.8-4.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    warning: '<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 3.6v3M6 8.3v.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
    serious: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.8l4.6 8H1.4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M6 5v2.2M6 8.6v.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    critical: '<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.8" fill="currentColor"/><path d="M4.2 4.2l3.6 3.6M7.8 4.2L4.2 7.8" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>'
  };
  var CATS = ['Manque pièce', 'Outillage', 'Non-conformité', 'Moyen de mesure', 'Documentation', "Main-d'œuvre"];
  var CAT_VAR = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6'];
  var STATE_LABEL = { good: 'Fluide', warning: 'À surveiller', serious: 'Saturé', critical: 'Goulot' };

  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function num(x, n) { if (x === null || x === undefined) return '-'; var v = Number(x).toFixed(n === undefined ? 1 : n); return v.replace('.', ',').replace(/,0$/, n === undefined ? '' : ',0'); }
  function d(s) { return s ? new Date(s) : null; }
  function fdate(s) { var x = d(s); if (!x) return ''; return x.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }); }
  function fdatetime(s) { var x = d(s); if (!x) return ''; return x.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' à ' + x.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); }
  function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function pill(level, text) { return '<span class="pill ' + level + '">' + ICON[level] + esc(text) + '</span>'; }

  // ---------------------------------------------------------------- accès aux données
  function call(fn, arg) {
    return new Promise(function (resolve, reject) {
      if (window.google && google.script && google.script.run) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](arg);
      } else if (window.LOCAL_API && window.LOCAL_API[fn]) {
        Promise.resolve(window.LOCAL_API[fn](arg)).then(resolve, reject);
      } else reject(new Error('Aucune source de données'));
    });
  }

  // ---------------------------------------------------------------- infobulle
  var tip = document.getElementById('tip');
  document.addEventListener('mousemove', function (e) {
    var t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) { tip.style.opacity = 0; return; }
    // Le texte est réencodé puis seules <b> et <br> sont rétablies : aucune saisie ne peut injecter de HTML.
    tip.innerHTML = esc(t.getAttribute('data-tip')).replace(/&lt;(\/?b|br)&gt;/g, '<$1>');
    var x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
    var y = e.clientY + 16 + tip.offsetHeight > window.innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 16;
    tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.style.opacity = 1;
  });

  // ---------------------------------------------------------------- graphiques SVG
  function niceMax(v) { if (v <= 0) return 1; var p = Math.pow(10, Math.floor(Math.log10(v))); var m = [1, 2, 2.5, 5, 10].find(function (k) { return k * p >= v; }); return m * p; }
  /** Maximum d'axe dont les 4 graduations tombent sur des entiers ronds. */
  function intMax(v) { if (v <= 0) return 4; var p = Math.pow(10, Math.floor(Math.log10(v / 4))); var step = [1, 2, 2.5, 3, 4, 5, 10].map(function (k) { return k * p; }).find(function (st) { return 4 * st >= v && (st >= 1 ? st % 1 === 0 : true); }); return 4 * step; }
  function yAxis(W, H, L, T, B, max, ticks, fmt) {
    var s = '';
    for (var i = 0; i <= ticks; i++) {
      var v = max * i / ticks, y = H - B - (H - B - T) * i / ticks;
      s += '<line x1="' + L + '" x2="' + (W - 6) + '" y1="' + y + '" y2="' + y + '" stroke="var(--grid)" stroke-width="1"/>';
      s += '<text x="' + (L - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + (fmt ? fmt(v) : num(v, 0)) + '</text>';
    }
    return s;
  }
  /** Barres verticales empilées ou groupées. series: [{name, color, values}] */
  function columns(opts) {
    var W = opts.width || 560, H = opts.height || 230, L = 40, T = 12, B = 26;
    var n = opts.labels.length, k = opts.series.length;
    var tot = opts.labels.map(function (_, i) { return opts.stacked ? opts.series.reduce(function (a, s) { return a + s.values[i]; }, 0) : Math.max.apply(null, opts.series.map(function (s) { return s.values[i]; })); });
    var max = intMax(Math.max(opts.refLine || 0, Math.max.apply(null, tot)) * 1.05);
    var slot = (W - L - 8) / n, bw = opts.stacked ? Math.min(34, slot * .58) : Math.min(18, slot * .7 / k);
    var sy = function (v) { return (H - B - T) * v / max; };
    var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opts.aria) + '">' + yAxis(W, H, L, T, B, max, 4, opts.yfmt);
    opts.labels.forEach(function (lab, i) {
      var cx = L + slot * i + slot / 2, base = H - B;
      if (opts.stacked) {
        var acc = 0, segs = opts.series.filter(function (sr) { return sr.values[i] > 0; });
        segs.forEach(function (sr, j) {
          var h = sy(sr.values[i]), y = base - sy(acc) - h; acc += sr.values[i];
          var top = j === segs.length - 1;
          var gap = j > 0 ? 2 : 0;
          s += '<path d="' + roundTop(cx - bw / 2, y, bw, Math.max(h - gap, 0.5), top ? 4 : 0) + '" fill="' + sr.color + '" data-tip="<b>' + esc(lab) + ' · ' + esc(sr.name) + '</b>' + esc(opts.tipfmt ? opts.tipfmt(sr.values[i]) : sr.values[i]) + '"/>';
        });
        if (opts.totalLabel) s += '<text x="' + cx + '" y="' + (base - sy(acc) - 6) + '" text-anchor="middle" font-size="11" fill="var(--ink-2)">' + opts.totalLabel(acc) + '</text>';
      } else {
        opts.series.forEach(function (sr, j) {
          var x = cx - (k * bw + (k - 1) * 2) / 2 + j * (bw + 2), h = sy(sr.values[i]);
          s += '<path d="' + roundTop(x, base - h, bw, Math.max(h, 0.5), 4) + '" fill="' + sr.color + '" data-tip="<b>' + esc(lab) + ' · ' + esc(sr.name) + '</b>' + esc(opts.tipfmt ? opts.tipfmt(sr.values[i]) : sr.values[i]) + '"/>';
        });
      }
      s += '<text x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + esc(lab) + '</text>';
    });
    if (opts.refLine) {
      var y = H - B - sy(opts.refLine);
      s += '<line x1="' + L + '" x2="' + (W - 6) + '" y1="' + y + '" y2="' + y + '" stroke="var(--ink-2)" stroke-dasharray="5 4" stroke-width="1.5"/>';
      s += '<text x="' + (W - 8) + '" y="' + (y - 6) + '" text-anchor="end" font-size="11" fill="var(--ink-2)">' + esc(opts.refLabel) + '</text>';
    }
    s += '<line x1="' + L + '" x2="' + (W - 6) + '" y1="' + (H - B) + '" y2="' + (H - B) + '" stroke="var(--axis)"/>';
    return s + '</svg>';
  }
  function roundTop(x, y, w, h, r) {
    r = Math.min(r, w / 2, h);
    return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z';
  }
  /** Courbes. series: [{name, color, values}] */
  function lines(opts) {
    var W = opts.width || 560, H = opts.height || 220, L = 34, T = 12, B = 26, R = 86;
    var n = opts.labels.length;
    var max = intMax(Math.max.apply(null, opts.series.map(function (s) { return Math.max.apply(null, s.values); })) * 1.1);
    var sx = function (i) { return L + (W - L - R) * i / (n - 1); }, sy = function (v) { return H - B - (H - B - T) * v / max; };
    var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opts.aria) + '">' + yAxis(W - R + 6, H, L, T, B, max, 4);
    opts.labels.forEach(function (lab, i) { if (i % Math.ceil(n / 6) === 0 || i === n - 1) s += '<text x="' + sx(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + esc(lab) + '</text>'; });
    opts.series.forEach(function (sr) {
      s += '<polyline fill="none" stroke="' + sr.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="' + sr.values.map(function (v, i) { return sx(i) + ',' + sy(v); }).join(' ') + '"/>';
      var li = n - 1;
      s += '<circle cx="' + sx(li) + '" cy="' + sy(sr.values[li]) + '" r="4.5" fill="' + sr.color + '" stroke="var(--surface)" stroke-width="2"/>';
      s += '<text x="' + (sx(li) + 10) + '" y="' + (sy(sr.values[li]) + 4) + '" font-size="11.5" font-weight="600" fill="var(--ink-2)">' + esc(sr.name) + ' ' + sr.values[li] + '</text>';
    });
    opts.labels.forEach(function (lab, i) {
      var x0 = i === 0 ? L : (sx(i - 1) + sx(i)) / 2, x1 = i === n - 1 ? W - R : (sx(i) + sx(i + 1)) / 2;
      var t = '<b>' + esc(lab) + '</b>' + opts.series.map(function (sr) { return esc(sr.name) + ' : ' + sr.values[i]; }).join('<br>');
      s += '<rect x="' + x0 + '" y="' + T + '" width="' + (x1 - x0) + '" height="' + (H - B - T) + '" fill="transparent" data-tip="' + t + '"/>';
    });
    return s + '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + (H - B) + '" y2="' + (H - B) + '" stroke="var(--axis)"/></svg>';
  }
  /** Pareto horizontal : barre = minutes, texte = part et cumul. */
  function pareto(rows) {
    var W = 560, rowH = 38, L = 132, R = 170, H = rows.length * rowH + 8;
    var max = Math.max.apply(null, rows.map(function (r) { return r.minutes; })) || 1;
    var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Pareto des aléas en minutes d\'arrêt">';
    rows.forEach(function (r, i) {
      var y = 4 + i * rowH, w = (W - L - R) * r.minutes / max, color = 'var(' + CAT_VAR[CATS.indexOf(r.key)] + ')';
      s += '<text x="' + (L - 10) + '" y="' + (y + 18) + '" text-anchor="end" font-size="12" fill="var(--ink-2)">' + esc(r.key) + '</text>';
      s += '<path d="' + roundRight(L, y + 5, Math.max(w, 2), rowH - 12, 4) + '" fill="' + color + '" data-tip="<b>' + esc(r.key) + '</b>' + r.count + ' aléas, ' + r.minutes + ' min<br>' + num(r.pct) + ' % du total, cumul ' + num(r.cumPct) + ' %"/>';
      s += '<text x="' + (L + w + 8) + '" y="' + (y + 18) + '" font-size="12" font-weight="700" fill="var(--ink)">' + num(r.minutes / 60) + ' h</text>';
      s += '<text x="' + (W - 4) + '" y="' + (y + 18) + '" text-anchor="end" font-size="11.5" fill="var(--muted)">' + num(r.pct, 0) + ' % · cumul ' + num(r.cumPct, 0) + ' %</text>';
    });
    return s + '</svg>';
  }
  function roundRight(x, y, w, h, r) { r = Math.min(r, h / 2, w); return 'M' + x + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h - r) + 'Q' + (x + w) + ',' + (y + h) + ' ' + (x + w - r) + ',' + (y + h) + 'H' + x + 'Z'; }
  function spark(vals) {
    var W = 64, H = 22, max = 100, min = 0;
    var pts = vals.map(function (v, i) { return (2 + (W - 4) * i / Math.max(vals.length - 1, 1)) + ',' + (H - 2 - (H - 4) * (v - min) / (max - min)); });
    return '<svg width="' + W + '" height="' + H + '" aria-hidden="true"><polyline fill="none" stroke="var(--s1)" stroke-width="1.6" points="' + pts.join(' ') + '"/></svg>';
  }
  function table(headers, rows) {
    return '<div class="tbl"><table><thead><tr>' + headers.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
  }
  function legend(items) { return '<div class="legend">' + items.map(function (it) { return '<span><i class="sw" style="' + it.style + '"></i>' + esc(it.name) + '</span>'; }).join('') + '</div>'; }

  // ---------------------------------------------------------------- rendu
  function render(data) {
    var k = data.kpis, f = k.flow, a = k.aleas, m = k.metro;
    var h = '';
    h += '<header class="top"><div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15h4l2.5-6 3 9 2.5-5H21" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
      '<div><h1>Cadence Cockpit</h1><div class="sub">Ligne d\'assemblage simulée · ' + k.line.length + ' postes · données au ' + fdatetime(k.generatedAt) + '</div></div><div class="spacer"></div>' +
      '<span class="chip"><span class="dot" style="background:' + (data.gemini ? 'var(--good)' : 'var(--muted)') + '"></span>' + (data.gemini ? 'Gemini actif' : 'Gemini non configuré') + '</span>' +
      '<span class="actions"><button id="btn-brief">Générer le brief</button> <button class="primary" id="btn-refresh">Rafraîchir</button></span></header>';

    var lateCrit = m.late.length > 0, bott = k.bottleneck;
    h += '<section class="tiles">' + [
      tile('Livraisons 7 jours', f.delivered7 + '<small> / ' + f.due7 + '</small>', 'lots livrés / prévus', false),
      tile('Respect du plan', (f.onTimePct === null ? '-' : f.onTimePct + '<small> %</small>'), f.onTimeCount28 + ' lots à l\'heure sur ' + f.dueCount28 + ' (28 j)', false),
      tile('Encours', k.wipTotal + '<small> lots</small>', bott ? 'goulot ' + bott.code + ' : ' + bott.queue + ' en file' : 'aucun goulot', bott && bott.queue >= 3),
      tile('Temps de traversée', num(f.leadTimeH) + '<small> h</small>', 'standard ' + num(f.leadTimeStdH) + ' h (heures ouvrées)', false),
      tile('Arrêts sur aléas', num(a.stopH7) + '<small> h</small>', a.count7 + ' aléas sur 7 jours', false),
      tile('Métrologie', m.late.length + '<small> en retard</small>', m.toPlan.length + ' à planifier sous 30 j', lateCrit)
    ].join('') + '</section>';

    // La ligne
    h += '<section class="card" style="margin-bottom:14px"><h2>La ligne en direct</h2><div class="hint">Chaque carré est un lot : plein = en cours d\'opération, contour = en file d\'attente. Barre : opération moyenne sur 14 jours face au standard (trait).</div><div class="flow">';
    k.wip.forEach(function (s) {
      var t = k.times.filter(function (x) { return x.code === s.code; })[0] || {};
      var lots = s.lots.map(function (l) { return '<i class="lot ' + (l.state === 'en cours' ? 'run' : 'wait') + '" data-tip="<b>' + esc(l.lot) + '</b>' + esc(l.state) + '"></i>'; }).join('');
      var ratio = t.opH && t.stdH ? Math.min(t.opH / (t.stdH * 1.4), 1) : 0;
      h += '<div class="st ' + (s.level === 'critical' || s.level === 'serious' ? s.level : '') + '"><div style="display:flex;justify-content:space-between;align-items:center;gap:6px"><span class="code">' + s.code + '</span>' + pill(s.level, STATE_LABEL[s.level]) + '</div>' +
        '<div class="name">' + esc(s.name) + (s.capacity > 1 ? ' · ' + s.capacity + ' positions' : '') + '</div><div class="lots">' + (lots || '<span style="font-size:11.5px;color:var(--muted)">vide</span>') + '</div>' +
        '<div class="meta"><span>' + s.inProgress + ' en cours · ' + s.queue + ' en file</span></div>' +
        '<div class="bar" data-tip="<b>' + s.code + '</b>Opération moyenne ' + num(t.opH) + ' h, standard ' + num(t.stdH) + ' h<br>Attente moyenne ' + num(t.waitH) + ' h"><i style="width:' + (100 * ratio) + '%;' + (t.overStdPct > 10 ? 'background:var(--s2)' : '') + '"></i><b style="left:' + (100 / 1.4) + '%"></b></div>' +
        '<div class="meta"><span>' + num(t.opH) + ' h / std ' + num(t.stdH) + ' h</span><span>' + (t.overStdPct === null ? '' : (t.overStdPct > 0 ? '+' : '') + t.overStdPct + ' %') + '</span></div></div>';
    });
    h += '</div>' + legend([{ name: 'En cours', style: 'background:var(--s1)' }, { name: 'En file', style: 'box-shadow:inset 0 0 0 2px var(--s2)' }, { name: 'Opération au-dessus du standard', style: 'background:var(--s2)' }]) + '</section>';

    // Brief + récurrences
    h += '<section class="row r-2"><div class="card brief"><h2>Brief du jour</h2>';
    if (data.brief) {
      h += '<div class="src">' + pill(String(data.brief.source).indexOf('Gemini') === 0 ? 'good' : 'warning', data.brief.source) + '<span class="sub">' + fdatetime(data.brief.date) + '</span></div>' +
        String(data.brief.text).split(/\n+/).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '<div class="check">Contrôle des chiffres : ' + esc(data.brief.check) + '</div>';
    } else h += '<div class="hint">Aucun brief : cliquez sur « Générer le brief ».</div>';
    h += '</div><div class="card"><h2>Aléas récurrents</h2><div class="hint">Même poste, même catégorie, au moins 3 fois en 21 jours. Sans action durable, c\'est une priorité.</div><div class="rec">';
    if (!a.recurrences.length) h += '<div class="hint">Aucune récurrence détectée.</div>';
    a.recurrences.forEach(function (r) {
      h += '<div class="it"><div class="big">' + r.count + '<small>aléas</small></div><div><div class="t">' + esc(r.poste) + ' · ' + esc(r.categorie) + '</div>' +
        '<div class="d">' + num(r.minutes / 60) + ' h d\'arrêt · tendance sur 14 jours : ' + esc(r.trend) + ' (' + r.prev14 + ' → ' + r.last14 + ')</div>' +
        '<div class="d">Dernier : « ' + esc(r.lastDescription) + ' »</div>' +
        '<div class="act">' + (r.hasDurable ? '<b>Action durable :</b> ' + esc(r.durable) : '<b style="color:var(--critical-ink)">Aucune action durable</b> : analyse des causes racines à lancer') + '</div></div>' +
        pill(r.level, r.level === 'critical' ? 'Prioritaire' : r.level === 'serious' ? 'À traiter' : 'Sous contrôle') + '</div>';
    });
    h += '</div></div></section>';

    // Aléas : Pareto + semaines
    var weeks = a.weekly.map(function (w) { return w.week; });
    h += '<section class="row r-eq"><div class="card"><h2>Pareto des aléas</h2><div class="hint">Heures d\'arrêt par catégorie sur 28 jours.</div>' + pareto(a.paretoCategorie) + '</div>' +
      '<div class="card"><h2>Arrêts par semaine et par catégorie</h2><div class="hint">Les manques pièces disparaissent après le kanban ; l\'outillage prend le relais.</div>' +
      columns({ labels: weeks, stacked: true, aria: 'Heures d\'arrêt par semaine et par catégorie', yfmt: function (v) { return num(v, 0) + ' h'; }, tipfmt: function (v) { return num(v) + ' h d\'arrêt'; }, totalLabel: function (v) { return num(v, 0) + ' h'; },
        series: CATS.map(function (c, i) { return { name: c, color: 'var(' + CAT_VAR[i] + ')', values: a.weekly.map(function (w) { return (w[c] || 0) / 60; }) }; }) }) +
      legend(CATS.map(function (c, i) { return { name: c, style: 'background:var(' + CAT_VAR[i] + ')' }; })) + '</div></section>';

    // Flux
    var wh = k.wipHistory;
    h += '<section class="row r-eq"><div class="card"><h2>Lots livrés par semaine</h2><div class="hint">Livrés face au plan.</div>' +
      columns({ labels: f.weekly.map(function (w) { return w.week; }), aria: 'Lots livrés et prévus par semaine', series: [
        { name: 'Prévus', color: 'var(--ref)', values: f.weekly.map(function (w) { return w.planned; }) },
        { name: 'Livrés', color: 'var(--s1)', values: f.weekly.map(function (w) { return w.delivered; }) }], tipfmt: function (v) { return v + ' lots'; } }) +
      legend([{ name: 'Prévus', style: 'background:var(--ref)' }, { name: 'Livrés', style: 'background:var(--s1)' }]) + '</div>' +
      '<div class="card"><h2>Encours en fin de journée</h2><div class="hint">Total de la ligne et file au poste goulot, sur 20 jours ouvrés.</div>' +
      lines({ labels: wh.map(function (x) { return fdate(x.date); }), aria: 'Encours par jour', series: [
        { name: 'Ligne', color: 'var(--s1)', values: wh.map(function (x) { return x.total; }) },
        { name: bott ? bott.code : 'P30', color: 'var(--s2)', values: wh.map(function (x) { return x[bott ? bott.code : 'P30'] || 0; }) }] }) +
      legend([{ name: 'Ligne entière', style: 'background:var(--s1)' }, { name: 'Poste ' + (bott ? bott.code : 'P30'), style: 'background:var(--s2)' }]) + '</div></section>';

    // Métrologie + 5S
    var lv = m.leveling;
    h += '<section class="row r-2b"><div class="card"><h2>Parc d\'instruments de mesure</h2><div class="hint">' + m.total + ' instruments suivis. Un instrument en retard d\'étalonnage doit être retiré du poste.</div>' +
      '<div class="metro-head">' +
      '<div class="stat"><div class="v" style="color:var(--critical-ink)">' + m.late.length + '</div><div class="l">en retard</div></div>' +
      '<div class="stat"><div class="v" style="color:var(--warning-ink)">' + m.toPlan.length + '</div><div class="l">à planifier sous 30 j</div></div>' +
      '<div class="stat"><div class="v">' + m.extend + '</div><div class="l">périodicités allongeables</div></div>' +
      '<div class="stat"><div class="v">' + m.shorten + '</div><div class="l">à raccourcir (non conformes)</div></div></div>' +
      table(['Instrument', 'Désignation', 'Poste', 'Échéance', 'Statut'], m.late.concat(m.toPlan).map(function (x) {
        return ['<b>' + esc(x.id) + '</b>', esc(x.designation), esc(x.poste), fdate(x.dueDate) + ' (' + (x.daysLeft < 0 ? (-x.daysLeft) + ' j de retard' : 'J-' + x.daysLeft) + ')', pill(x.level, x.status)]; })) +
      '<h2 style="margin-top:16px">Charge d\'étalonnage sur ' + lv.labels.length + ' semaines</h2><div class="hint">Lissage proposé : ' + lv.moves.length + ' étalonnages avancés (jamais retardés), pic de ' + lv.peakBefore + ' à ' + lv.peakAfter + ' par semaine.</div>' +
      columns({ labels: lv.labels, aria: 'Charge d\'étalonnage par semaine, avant et après lissage', refLine: lv.capacity, refLabel: 'capacité ' + lv.capacity + ' / sem.', tipfmt: function (v) { return v + ' étalonnage(s)'; }, series: [
        { name: 'Échéances actuelles', color: 'var(--ref)', values: lv.load }, { name: 'Après lissage', color: 'var(--s1)', values: lv.leveled }] }) +
      legend([{ name: 'Échéances actuelles', style: 'background:var(--ref)' }, { name: 'Après lissage', style: 'background:var(--s1)' }]) +
      '<details><summary>Voir les avancements proposés</summary>' + table(['Instrument', 'Poste', 'Semaine prévue', 'Semaine proposée'], lv.moves.map(function (x) { return [esc(x.id), esc(x.poste), esc(x.from), '<b>' + esc(x.to) + '</b>']; })) + '</details></div>';

    h += '<div class="card"><h2>Audits 5S</h2><div class="hint">Score du dernier audit, évolution sur une semaine et sur huit semaines.</div><div class="five">';
    k.fiveS.forEach(function (s) {
      var low = s.score < 60;
      h += '<div class="r" data-tip="<b>' + esc(s.code) + ' ' + esc(s.name) + '</b>Score ' + s.score + ' %<br>Point faible : ' + esc(s.weakest) + '"><span class="code">' + s.code + '</span><div class="track"><i class="' + (low ? 'low' : '') + '" style="width:' + s.score + '%"></i></div>' + spark(s.history) +
        '<span class="num">' + s.score + ' %<br><span class="delta ' + (s.delta > 0 ? 'up' : s.delta < 0 ? 'down' : '') + '">' + (s.delta > 0 ? '▲ +' : s.delta < 0 ? '▼ ' : '') + (s.delta === 0 ? '=' : s.delta) + '</span></span></div>';
    });
    var worst = k.fiveS.slice().sort(function (x, y) { return x.score - y.score; })[0];
    h += '</div><div class="hint" style="margin-top:12px">' + (worst ? pill(worst.score < 60 ? 'critical' : 'good', worst.code + ' : ' + worst.weakest) + ' point le plus faible du dernier audit.' : '') + '</div>' +
      '<h2 style="margin-top:18px">Retard au plan</h2><div class="hint">Lots dont la livraison prévue est passée.</div>' +
      (f.lateLots.length ? table(['Lot', 'Prévue', 'Retard'], f.lateLots.map(function (x) { return [esc(x.lot), fdate(x.prevue), num(x.retardH) + ' h']; })) : '<div class="hint">' + pill('good', 'Aucun lot en retard') + '</div>') +
      '</div></section>';

    h += '<div class="foot">Cadence Cockpit v' + esc(data.version) + ' · Google Sheets, Apps Script et Gemini · données simulées pour la démonstration</div>';
    document.getElementById('app').innerHTML = h;

    document.getElementById('btn-refresh').onclick = function () { this.disabled = true; load(); };
    document.getElementById('btn-brief').onclick = function () {
      var b = this; b.disabled = true; b.textContent = 'Rédaction...';
      call('generateBrief').then(load, function (e) { b.disabled = false; b.textContent = 'Générer le brief'; alertBox(e); });
    };
  }
  function tile(lab, val, note, alert) { return '<div class="tile' + (alert ? ' alert' : '') + '"><div class="lab">' + lab + '</div><div class="val">' + val + '</div><div class="note">' + esc(note) + '</div></div>'; }
  function alertBox(e) { document.getElementById('app').insertAdjacentHTML('afterbegin', '<div class="err">' + esc(e && e.message ? e.message : e) + '</div>'); }
  function load() { call('getDashboardData').then(render, alertBox); }
  load();
})();
</script>
</body>
</html>
